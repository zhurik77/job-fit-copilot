<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Job Fit Copilot — прозрачный разбор совпадения вакансии по факторам">
  <defs>
    <clipPath id="jfc-round"><rect x="0" y="0" width="900" height="320" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#jfc-round)">
    <rect x="0" y="0" width="900" height="320" fill="#FAF8F4"/>

    <!-- тёмная chrome-полоса, как в самой панели расширения -->
    <rect x="0" y="0" width="900" height="38" fill="#1A1713"/>
    <circle cx="20" cy="19" r="4" fill="#E0645B"/>
    <circle cx="36" cy="19" r="4" fill="#E5B45A"/>
    <circle cx="52" cy="19" r="4" fill="#58B368"/>
    <text x="76" y="24" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="12" fill="#8A8378">macuniverse.app / jfc / <tspan fill="#F2A33C">job-fit-copilot</tspan></text>

    <!-- заголовок и подпись -->
    <text x="40" y="98" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#1A1713">Job Fit Copilot</text>
    <text x="40" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8A8378">Разбор по факторам — не «чёрный ящик»</text>
    <text x="40" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8A8378">hh.ru · LinkedIn · Upwork</text>

    <!-- вердикт-чип -->
    <rect x="40" y="176" width="150" height="30" rx="15" fill="#E5F3E9"/>
    <text x="115" y="196" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3E9B5F">ОТКЛИКАТЬСЯ</text>

    <!-- дуга-индекс -->
    <g transform="translate(212,168)">
      <circle cx="30" cy="30" r="24" fill="none" stroke="#EAE4D9" stroke-width="7"/>
      <circle cx="30" cy="30" r="24" fill="none" stroke="#3E9B5F" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="150.8" stroke-dashoffset="39" transform="rotate(-90 30 30)"/>
      <text x="30" y="35" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="800" fill="#3E9B5F">74</text>
    </g>
    <text x="212" y="234" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#8A8378">ИНДЕКС / 100</text>

    <!-- правая карточка: разбор совпадения -->
    <rect x="480" y="70" width="380" height="210" rx="14" fill="#FFFFFF" stroke="#EAE4D9"/>
    <text x="502" y="98" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1" fill="#8A8378">РАЗБОР СОВПАДЕНИЯ</text>

    <text x="502" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A1713">Стек совпадает: Python, REST API</text>
    <rect x="502" y="130" width="336" height="20" rx="5" fill="#3E9B5F"/>
    <text x="826" y="144" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="800" fill="#FFFFFF">+18</text>

    <text x="502" y="170" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A1713">Нет опыта с Kubernetes</text>
    <rect x="502" y="178" width="187" height="20" rx="5" fill="#D4564A"/>
    <text x="677" y="192" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="800" fill="#FFFFFF">−10</text>

    <text x="502" y="218" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A1713">n8n/Zapier — прямое попадание</text>
    <rect x="502" y="226" width="150" height="20" rx="5" fill="#3E9B5F"/>
    <text x="640" y="240" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="800" fill="#FFFFFF">+8</text>

    <line x1="502" y1="258" x2="838" y2="258" stroke="#EAE4D9"/>
    <text x="502" y="274" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" fill="#1A1713">индекс</text>
    <text x="838" y="274" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" fill="#1A1713">74</text>
  </g>
</svg>
